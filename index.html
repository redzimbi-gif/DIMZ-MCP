<style>
  :root {

    text-align: center;
  }
  .wrap {
    max-width: 460px;
  }

  .logo-frame {
    position: relative;
    width: min(260px, 60vw);
    margin: 0 auto 4px;
    opacity: 0;
    transform: translateY(14px) scale(0.97);
    animation: logoIn 1s cubic-bezier(.16,1,.3,1) 0.15s forwards;
  }
  .logo-frame::before {
    content: "";
    position: absolute;
    inset: -34%;
    z-index: -1;
    border-radius: 50%;
    background: radial-gradient(circle, color-mix(in srgb, var(--or) 32%, transparent) 0%, transparent 70%);
    filter: blur(22px);
    animation: glowPulse 3.6s ease-in-out infinite;
  }
  .logo-frame img {
    display: block;
    width: 100%;
    height: auto;
    border-radius: 20px;
    box-shadow: 0 30px 60px -20px rgba(0,0,0,0.75);
  }

  h1 {
    margin: 36px 0 12px;
    font-family: var(--serif);
    font-weight: 600;
    font-size: clamp(1.4rem, 1.15rem + 1vw, 1.8rem);
    line-height: 1.35;
    color: var(--blanc);
    opacity: 0;
    animation: fadeUp 0.8s ease 0.55s forwards;
  }
  p {
    margin: 0;
    color: var(--blanc-soft);
    font-size: 1.02rem;
    line-height: 1.6;
    opacity: 0;
    animation: fadeUp 0.8s ease 0.7s forwards;
  }
  .contact {
    margin-top: 40px;
    font-size: 0.88rem;
    opacity: 0;
    animation: fadeUp 0.8s ease 0.85s forwards;
  }
  .contact a {
    color: var(--or-soft);
    text-decoration: none;
    border-bottom: 1px solid color-mix(in srgb, var(--or-soft) 40%, transparent);
    padding-bottom: 1px;
    transition: color 0.2s ease, border-color 0.2s ease;
  }
  .contact a:hover {
    color: var(--or);
    border-color: var(--or);
  }

  @keyframes logoIn { to { opacity: 1; transform: translateY(0) scale(1); } }
  @keyframes glowPulse { 0%, 100% { opacity: 0.5; transform: scale(1); } 50% { opacity: 0.85; transform: scale(1.08); } }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

  @media (prefers-reduced-motion: reduce) {
    .logo-frame, h1, p, .contact { animation: none; opacity: 1; transform: none; }
